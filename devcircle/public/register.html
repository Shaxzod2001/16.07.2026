<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ro'yxatdan o'tish — DevCircle</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <nav class="site-nav" aria-label="Asosiy navigatsiya">
    <a class="site-logo" href="index.html">DevCircle</a>
    <div class="nav-auth" id="auth-area" aria-live="polite"></div>
  </nav>
</header>

<main class="page">
  <h1 class="page-title" style="margin-bottom: 20px;">Ro'yxatdan o'tish</h1>

  <form class="form" id="register-form" novalidate>
    <p class="form-error" id="form-error" hidden></p>

    <div class="form-field">
      <label for="username">Foydalanuvchi nomi</label>
      <input type="text" id="username" name="username" autocomplete="username" required aria-describedby="username-error">
      <p class="field-error" id="username-error" hidden></p>
    </div>

    <div class="form-field">
      <label for="email">Elektron pochta</label>
      <input type="email" id="email" name="email" autocomplete="email" required aria-describedby="email-error">
      <p class="field-error" id="email-error" hidden></p>
    </div>

    <div class="form-field">
      <label for="password">Parol</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required aria-describedby="password-error">
      <p class="field-error" id="password-error" hidden></p>
    </div>

    <button type="submit" class="btn" id="submit-btn">Ro'yxatdan o'tish</button>

    <p class="form-footnote">
      Hisobingiz bormi? <a href="login.html">Kiring</a>
    </p>
  </form>
</main>

<script src="api.js"></script>
<script src="register.js"></script>
</body>
</html>
